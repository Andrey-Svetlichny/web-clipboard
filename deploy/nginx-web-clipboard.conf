#   sudo cp deploy/nginx-web-clipboard.conf /etc/nginx/sites-available/web-clipboard
#   sudo ln -s /etc/nginx/sites-available/web-clipboard /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d notes.example.com
#
# certbot rewrites this file in place: it adds the listen 443 / ssl_certificate lines
# and turns the port 80 block into a redirect. Run it after the first reload above,
# while this is still a plain HTTP server, or it has nothing to attach to.

server {
    listen 80;
    listen [::]:80;
    server_name notes.example.com;

    # Matches MAX_BODY in server/index.mjs. nginx rejects anything larger with 413
    # before it reaches the app. One request carries at most one attachment, so this is
    # sized for a single file, not for all of them.
    client_max_body_size 3m;

    # Nothing sensitive is in a path here — the payload is encrypted client-side and
    # never appears in a URL — but there is no reason to keep a record of who showed
    # up when. Drop both lines to get normal logging back.
    access_log off;
    error_log /var/log/nginx/web-clipboard.error.log error;

    location / {
        proxy_pass http://127.0.0.1:8833;
        proxy_http_version 1.1;

        # The app reads the first entry of X-Forwarded-For for per-IP rate limiting
        # (server/index.mjs:133). Setting it rather than appending means a client-sent
        # header cannot forge the bucket key.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # The app sets its own CSP, HSTS and cache-control headers. Do not add
        # add_header directives here: they would duplicate or conflict with those.
    }
}
